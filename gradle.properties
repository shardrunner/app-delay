org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# Connected tests run on a personal device: retain the app, its data and permission grants.
android.injected.androidTest.leaveApksInstalledAfterRun=true
# A signature mismatch must fail instead of uninstalling the existing app.
android.experimental.testOptions.uninstallIncompatibleApks=false
kotlin.code.style=official
